<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A股候选池 · 管理面板</title>
<style>
  :root{
    --bg:#0f1115; --card:#1a1d24; --card2:#22262f; --border:#2c313a;
    --text:#e6e8eb; --muted:#9aa3ad; --accent:#3b82f6; --accent2:#22d3ee;
    --hold-bg:#3a1418; --hold-border:#f43f5e; --watch-bg:#12202e; --watch-border:#0ea5e9;
    --past-bg:#1c1a12; --past-border:#a16207;
    --up:#22c55e; --down:#ef4444;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--text); font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; padding:16px; line-height:1.5;}
  .wrap{max-width:980px; margin:0 auto;}

  header h1{font-size:22px; font-weight:700; display:flex; align-items:center; gap:10px;}
  header h1 .badge{font-size:12px; font-weight:600; color:var(--accent2); border:1px solid var(--accent2); padding:2px 8px; border-radius:20px;}
  .sub{color:var(--muted); font-size:13px; margin-top:4px;}
  .updated{color:var(--muted); font-size:12px; margin-top:8px;}

  .stats{display:flex; gap:12px; flex-wrap:wrap; margin:16px 0;}
  .stat{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px 18px; flex:1; min-width:120px;}
  .stat .n{font-size:22px; font-weight:700;}
  .stat .l{font-size:12px; color:var(--muted); margin-top:2px;}

  .sec{margin:22px 0 10px; font-size:16px; font-weight:700; display:flex; align-items:center; gap:8px;}
  .sec .dot{width:8px; height:8px; border-radius:50%;}
  .sec.hold .dot{background:var(--hold-border);}
  .sec.watch .dot{background:var(--watch-border);}
  .sec.past .dot{background:var(--past-border);}
  .group{margin-top:14px;}
  .group-title{display:flex; align-items:center; gap:8px; font-size:14px; font-weight:700; color:var(--accent2); margin:0 2px 10px;}
  .group-title .bar{width:4px; height:14px; border-radius:2px; background:var(--accent2);}
  .group-title .cnt{color:var(--muted); font-size:12px; font-weight:600;}

  .cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px; align-items:stretch;}
  .card{border-radius:14px; padding:16px; border:1px solid var(--border); background:var(--card); position:relative; display:flex; flex-direction:column; height:100%;}
  .card.hold{background:var(--hold-bg); border-color:var(--hold-border);}
  .card.watch{background:var(--watch-bg); border-color:var(--watch-border);}
  .card.past{background:var(--past-bg); border-color:var(--past-border); opacity:.92;}
  .tag{position:absolute; top:12px; right:12px; font-size:11px; font-weight:700; padding:3px 10px; border-radius:20px;}
  .card.hold .tag{background:var(--hold-border); color:#fff;}
  .card.watch .tag{background:var(--watch-border); color:#fff;}
  .card.past .tag{background:var(--past-border); color:#fff;}
  .name{font-size:17px; font-weight:700; padding-right:64px;}
  .code{font-size:12px; color:var(--muted); margin-left:6px;}
  .topic{font-size:12px; color:var(--accent2); margin-top:2px; padding-right:64px;}
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:6px 12px; margin-top:12px; font-size:13px;}
  .grid .row{display:flex; justify-content:space-between;}
  .grid .row .k{color:var(--muted);}
  .grid .row .v{font-weight:600;}
  .focus{margin-top:auto; background:rgba(255,255,255,0.05); border-left:3px solid var(--accent); padding:8px 10px; border-radius:6px; font-size:13px;}
  .focus .fh{color:var(--accent2); font-weight:700; font-size:12px;}
  .focus::before{content:""; display:block; height:12px;}
  .note{color:var(--muted); font-size:12px; margin-top:8px;}

  .empty{color:var(--muted); font-size:14px; padding:24px; text-align:center; border:1px dashed var(--border); border-radius:12px;}

  footer{color:var(--muted); font-size:11px; margin-top:24px; text-align:center;}
  @media(max-width:640px){ header h1{font-size:19px;} .grid{grid-template-columns:1fr;} }
</style>
</head>

<div class="wrap">

    <div class="updated" id="updatedText"></div>

  <div class="sec hold"><span class="dot"></span> 已持仓 <span id="holdCnt" style="color:var(--muted);font-size:13px;"></span><span id="holdTotal" style="color:var(--accent2);font-size:13px;font-weight:600;"></span></div>
  <div class="cards" id="holdCards"></div>

  <div class="sec watch"><span class="dot"></span> 自选观察 <span id="watchCnt" style="color:var(--muted);font-size:13px;"></span></div>
  <div class="cards" id="watchCards"></div>

  <div class="sec past"><span class="dot"></span> 曾持有（已了结） <span id="pastCnt" style="color:var(--muted);font-size:13px;"></span><span id="pastTotal" style="color:var(--past-border);font-size:13px;font-weight:600;"></span></div>
  <div class="cards" id="pastCards"></div>

  <footer>数据源：飞书多维表格（A股候选池）｜ 婉儿维护 · 晚间复盘实时更新 ｜ 本页仅展示</footer>
</div>

// 解析持仓量字符串（如 "600股" -> 600，"100" -> 100）
function qtyNum(v){ if(v==null) return 0; const m = String(v).match(/\d+/); return m ? parseFloat(m[0]) : 0; }
// 金额展示
function fmtMoney(n){ return '¥' + (n||0).toLocaleString('zh-CN', {maximumFractionDigits:2}); }

function render(){
  const hold = data.filter(d=>d.状态==='持仓');
  const watch = data.filter(d=>d.状态==='自选').sort((a,b)=>(a.优先级??99)-(b.优先级??99));
  const past = data.filter(d=>d.状态==='曾持有').sort((a,b)=>String(b.卖出时间||'').localeCompare(String(a.卖出时间||'')));
  document.getElementById('stHold').textContent = hold.length;
  document.getElementById('stWatch').textContent = watch.length;
  document.getElementById('stPast').textContent = past.length;
  document.getElementById('stTotal').textContent = data.length;

  // 持仓总额 = Σ 买入价×持仓量
  let holdTotal = 0;
  hold.forEach(d=>{ if(d.买入价!=null) holdTotal += d.买入价 * qtyNum(d.持仓量); });
  // 曾持有 买入/卖出总额
  let pastBuy = 0, pastSell = 0;
  past.forEach(d=>{
    if(d.买入价!=null) pastBuy += d.买入价 * qtyNum(d.持仓量);
    if(d.卖出价!=null) pastSell += d.卖出价 * qtyNum(d.持仓量);
  });

  document.getElementById('holdCnt').textContent = hold.length ? `（${hold.length}只）` : '';
  document.getElementById('watchCnt').textContent = watch.length ? `（${watch.length}只）` : '';
  document.getElementById('pastCnt').textContent = past.length ? `（${past.length}只）` : '';
  document.getElementById('holdTotal').textContent = hold.length ? ` · 持仓总额 ${fmtMoney(holdTotal)}` : '';
  document.getElementById('pastTotal').textContent = past.length ? ` · 买入 ${fmtMoney(pastBuy)} / 卖出 ${fmtMoney(pastSell)}` : '';

  renderCards('holdCards', hold, 'hold');
  renderCards('watchCards', watch, 'watch');
  renderCards('pastCards', past, 'past');
  const ups = data.map(d=>d.更新时间).filter(Boolean).sort();
  const latest = ups.length ? ups[ups.length-1] : '—';
  document.getElementById('updatedText').textContent = '共 ' + data.length + ' 只 · 数据更新：' + latest;
}

function renderCards(elId, list, cls){
  const el = document.getElementById(elId);
  if(!list.length){ el.innerHTML = '<div class="empty">暂无' + (cls==='hold'?'持仓':cls==='past'?'曾持有':'自选') + '股票</div>'; return; }
  // 自选观察区 & 曾持有区：平铺展示（不按板块分组，保证对齐整齐）；持仓保留板块分组
  if(cls==='watch' || cls==='past'){
    el.innerHTML = `<div class="cards">${list.map(d=>cardHTML(d,cls)).join('')}</div>`;
    return;
  }
  // 按板块分组
  const groups = {};
  list.forEach(d=>{ const g = d.板块 || '未分类'; (groups[g] = groups[g] || []).push(d); });
  const keys = Object.keys(groups);
  el.innerHTML = keys.map(g=>{
    const items = groups[g];
    return `<div class="group">
      <div class="group-title"><span class="bar"></span>${esc(g)} <span class="cnt">（${items.length}只）</span></div>
      <div class="cards">${items.map(d=>cardHTML(d,cls)).join('')}</div>
    </div>`;
  }).join('');
}

function cardHTML(d, cls){
  const buy = d.买入价!=null ? d.买入价 : '—';
  const now = d.现价!=null ? d.现价 : '—';
  const stop = d.止损位!=null ? d.止损位 : '—';
  const tp1 = d.止盈位1!=null ? d.止盈位1 : '—';
  const tp2 = d.止盈位2!=null ? d.止盈位2 : '—';
  const tag = cls==='hold'?'持仓':cls==='past'?'曾持有':'自选';
  const qty = qtyNum(d.持仓量);
  // 天数（交易日）：持仓=已持有，自选=已自选，曾持有=持有天数
  let dayRow='';
  {
    const ref = d.更新时间 || null;
    if(cls==='hold'){ const n=tradingDays(d.买入时间||d.入池时间, ref); if(n!=null){ const c=n>=10?'var(--down)':(n>=8?'#f59e0b':'var(--accent2)'); dayRow=`<div class="row"><span class="k">已持有</span><span class="v" style="color:${c}">${n} 天${n>=10?' ⚠️时间止损':''}</span></div>`; } }
    else if(cls==='past'){ const n=tradingDays(d.买入时间, d.卖出时间); if(n!=null){ dayRow=`<div class="row"><span class="k">持有</span><span class="v">${n} 天</span></div>`; } }
    else { const n=tradingDays(d.入池时间, ref); if(n!=null){ dayRow=`<div class="row"><span class="k">已自选</span><span class="v" style="color:var(--accent2)">${n} 天</span></div>`; } }
  }
  // 持仓：总额 = 现价(缺省买入价) × 量
  const holdAmt = cls==='hold' ? ((d.现价??d.买入价)!=null ? (d.现价??d.买入价)*qty : null) : null;
  // 曾持有：买入/卖出总额
  const pastBuyAmt = cls==='past' && d.买入价!=null ? d.买入价*qty : null;
  const pastSellAmt = cls==='past' && d.卖出价!=null ? d.卖出价*qty : null;
  return `<div class="card ${cls}">
    <span class="tag">${tag}</span>
    <div class="name">${cls!=='hold' && cls!=='past' && d.优先级?`<span class="pr" style="display:inline-flex;align-items:center;justify-content:center;background:var(--accent);color:#fff;border-radius:50%;width:20px;height:20px;font-size:12px;font-weight:700;margin-right:6px;vertical-align:middle;">${d.优先级}</span>`:''}${esc(d.股票名称)}<span class="code">${esc(d.代码)}</span></div>
    <div class="topic">${esc(d.题材||'')}</div>
    <div class="grid">
      <div class="row"><span class="k">买入价</span><span class="v">${buy}</span></div>
      <div class="row"><span class="k">现价</span><span class="v">${now}</span></div>
      <div class="row"><span class="k">止损</span><span class="v" style="color:var(--down)">${stop}</span></div>
      <div class="row"><span class="k">止盈1/2</span><span class="v" style="color:var(--up)">${tp1} / ${tp2}</span></div>
      <div class="row"><span class="k">持仓量</span><span class="v">${esc(d.持仓量||'—')}</span></div>
      ${cls==='hold' && holdAmt!=null?`<div class="row"><span class="k">持仓总额</span><span class="v" style="color:var(--accent2)">${fmtMoney(holdAmt)}</span></div>`:''}
      ${cls==='past' && pastBuyAmt!=null?`<div class="row"><span class="k">买入总额</span><span class="v">${fmtMoney(pastBuyAmt)}</span></div>`:''}
      ${cls==='past' && pastSellAmt!=null?`<div class="row"><span class="k">卖出总额</span><span class="v" style="color:var(--up)">${fmtMoney(pastSellAmt)}</span></div>`:''}
      <div class="row"><span class="k">${cls==='past'?'买入时间':(cls==='hold'?'买入时间':'入池时间')}</span><span class="v">${esc(cls==='hold'||cls==='past'?(d.买入时间||d.入池时间||'—'):(d.入池时间||'—'))}</span></div>
      ${cls==='past'?`<div class="row"><span class="k">卖出时间</span><span class="v">${esc(d.卖出时间||'—')}</span></div>
      <div class="row"><span class="k">卖出价</span><span class="v">${d.卖出价!=null?d.卖出价:'—'}</span></div>
      <div class="row"><span class="k">盈亏</span><span class="v" style="color:${(d.盈亏??0)>=0?'var(--up)':'var(--down)'}">${d.盈亏!=null?d.盈亏:'—'}</span></div>`:''}
      ${dayRow}
      <div class="row"><span class="k">更新</span><span class="v">${esc(d.更新时间||'—')}</span></div>
    </div>
    ${d.次日关注点?`<div class="focus"><div class="fh">🔍 复盘 / 次日关注</div>${esc(d.次日关注点)}</div>`:''}
    ${d.备注?`<div class="note">📝 ${esc(d.备注)}</div>`:''}
  </div>`;
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// 天数计算（交易日，跳过周末）；fromStr 到 toStr（缺省=更新日/今日）
function parseDate(s){ const m=String(s==null?'':s).match(/(\d{4})-(\d{1,2})-(\d{1,2})/); if(!m) return null; return new Date(+m[1],+m[2]-1,+m[3]); }
function tradingDays(fromStr, toStr){ const a=parseDate(fromStr); const b=toStr?parseDate(toStr):new Date(); if(!a||!b||b<a) return null; let n=0; const d=new Date(a); while(d<=b){ const w=d.getDay(); if(w!==0&&w!==6) n++; d.setDate(d.getDate()+1);} return n; }

load(); render();
</script>
